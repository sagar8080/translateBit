[project]
name = "translatebit-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "aiortc>=1.14,<2", "faster-whisper>=1.2,<2", "sentencepiece>=0.2,<1"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
